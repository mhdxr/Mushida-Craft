name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check & Lint
        run: npm run verify

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build must not fail on missing runtime secrets; provide safe placeholders.
          NEXT_TELEMETRY_DISABLED: "1"

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail the pipeline on ANY vulnerability (prod + dev tooling).
      # Note: `npm run audit:ci` uses --omit=dev, which exits 0 even when
      # dev-tooling transitive deps are vulnerable — that is NOT a real gate.
      # Full audit (no --omit) exits non-zero whenever npm finds an issue.
      - name: npm audit (all deps — hard gate)
        run: npm audit --audit-level=moderate